name: Deploy Sextant DP Resilience Cockpit to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:

  deploy:

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify DP Cockpit files
        run: |
          echo "Checking Sextant DP Resilience Cockpit..."

          test -f index.html
          test -f dp_simulation_engine.js
          test -f dp_scenarios.js

          echo "index.html: OK"
          echo "dp_simulation_engine.js: OK"
          echo "dp_scenarios.js: OK"

      - name: Upload DP Cockpit artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy DP Cockpit to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4