name: Sextant DP System CI

on:
push:
branches:
- main
- develop
- "feature/**"

pull_request:
branches:
- main
- develop

workflow_dispatch:

jobs:

validate-dp-system:
name: Validate Sextant DP Simulation System
runs-on: ubuntu-latest

steps:

  # -------------------------------------------------------
  # CHECKOUT
  # -------------------------------------------------------

  - name: Checkout code
    uses: actions/checkout@v4


  # -------------------------------------------------------
  # PYTHON ENVIRONMENT
  # -------------------------------------------------------

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.10"


  # -------------------------------------------------------
  # NODE.JS ENVIRONMENT
  # -------------------------------------------------------

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: "20"


  # -------------------------------------------------------
  # REPOSITORY STRUCTURE
  # -------------------------------------------------------

  - name: Verify DP prototype files
    run: |
      test -f dp_cockpit.html
      test -f dp_simulation_engine.js
      test -f dp_scenarios.js

      echo "Required DP prototype files:"
      echo "PASS: dp_cockpit.html"
      echo "PASS: dp_simulation_engine.js"
      echo "PASS: dp_scenarios.js"


  # -------------------------------------------------------
  # PYTHON VALIDATION
  # -------------------------------------------------------

  - name: Check Python simulation engine
    run: |
      if [ -f simulation_engine.py ]; then
        python -m py_compile simulation_engine.py
        echo "Python simulation engine syntax: PASS"
      else
        echo "simulation_engine.py not present - browser engine is active."
      fi


  # -------------------------------------------------------
  # JAVASCRIPT SYNTAX VALIDATION
  # -------------------------------------------------------

  - name: Validate JavaScript syntax
    run: |
      node --check dp_simulation_engine.js
      node --check dp_scenarios.js

      echo "JavaScript syntax validation: PASS"


  # -------------------------------------------------------
  # ENGINE LOAD TEST
  # -------------------------------------------------------

  - name: Load DP simulation engine
    run: |
      node <<'NODE'
      const engine = require('./dp_simulation_engine.js');

      if (!engine) {
        throw new Error(
          'DP Simulation Engine failed to load.'
        );
      }

      if (engine.version !== '1.0.0') {
        throw new Error(
          `Unexpected engine version: ${engine.version}`
        );
      }

      console.log(
        `DP Simulation Engine ${engine.version}: PASS`
      );
      NODE


  # -------------------------------------------------------
  # NORMAL SCENARIO
  # -------------------------------------------------------

  - name: Validate normal scenario
    run: |
      node <<'NODE'
      const engine = require('./dp_simulation_engine.js');

      const scenario =
        engine.scenarios.normal();

      const result =
        engine.run(scenario);

      if (!result) {
        throw new Error(
          'Normal scenario failed.'
        );
      }

      if (!result.environment) {
        throw new Error(
          'Normal environment result missing.'
        );
      }

      if (!result.primary) {
        throw new Error(
          'Normal Primary AI result missing.'
        );
      }

      if (!result.secondary) {
        throw new Error(
          'Normal Secondary AI result missing.'
        );
      }

      if (!result.stabilizer) {
        throw new Error(
          'Normal Stabilizer result missing.'
        );
      }

      console.log(
        `NORMAL: PASS | ` +
        `Stress=${result.environment.environmentalStress.toFixed(2)} | ` +
        `Risk=${result.risk}`
      );
      NODE


  # -------------------------------------------------------
  # HEAVY WEATHER SCENARIO
  # -------------------------------------------------------

  - name: Validate heavy weather scenario
    run: |
      node <<'NODE'
      const engine = require('./dp_simulation_engine.js');

      const scenario =
        engine.scenarios.heavyWeather();

      const result =
        engine.run(scenario);

      if (!result) {
        throw new Error(
          'Heavy weather scenario failed.'
        );
      }

      if (!result.risk) {
        throw new Error(
          'Heavy weather risk classification missing.'
        );
      }

      console.log(
        `HEAVY WEATHER: PASS | ` +
        `Stress=${result.environment.environmentalStress.toFixed(2)} | ` +
        `Risk=${result.risk}`
      );
      NODE


  # -------------------------------------------------------
  # CRITICAL SCENARIO
  # -------------------------------------------------------

  - name: Validate critical scenario
    run: |
      node <<'NODE'
      const engine = require('./dp_simulation_engine.js');

      const scenario =
        engine.scenarios.critical();

      const result =
        engine.run(scenario);

      if (!result) {
        throw new Error(
          'Critical scenario failed.'
        );
      }

      if (!result.human) {
        throw new Error(
          'Human-in-the-loop result missing.'
        );
      }

      if (!result.stabilizer) {
        throw new Error(
          'Critical stabilizer result missing.'
        );
      }

      console.log(
        `CRITICAL: PASS | ` +
        `Stress=${result.environment.environmentalStress.toFixed(2)} | ` +
        `Risk=${result.risk} | ` +
        `HumanOverride=${result.human.override}`
      );
      NODE


  # -------------------------------------------------------
  # DETERMINISTIC REPLAY TEST
  # -------------------------------------------------------

  - name: Validate deterministic replay
    run: |
      node <<'NODE'
      const engine = require('./dp_simulation_engine.js');

      const scenario = {
        name: 'DETERMINISTIC_TEST',
        wind: 60,
        current: 55,
        wave: 65,
        tidal: 50
      };

      const result1 =
        engine.run(scenario);

      const result2 =
        engine.run(scenario);

      const stress1 =
        result1.environment.environmentalStress;

      const stress2 =
        result2.environment.environmentalStress;

      if (stress1 !== stress2) {
        throw new Error(
          'Deterministic replay failed: environmental stress differs.'
        );
      }

      if (result1.risk !== result2.risk) {
        throw new Error(
          'Deterministic replay failed: risk differs.'
        );
      }

      if (
        result1.primary.thrustOutput !==
        result2.primary.thrustOutput
      ) {
        throw new Error(
          'Deterministic replay failed: Primary AI output differs.'
        );
      }

      if (
        result1.secondary.thrustOutput !==
        result2.secondary.thrustOutput
      ) {
        throw new Error(
          'Deterministic replay failed: Secondary AI output differs.'
        );
      }

      console.log(
        'Deterministic replay: PASS'
      );
      NODE


  # -------------------------------------------------------
  # COCKPIT STRUCTURE
  # -------------------------------------------------------

  - name: Validate DP cockpit
    run: |
      grep -q "<!DOCTYPE html>" dp_cockpit.html
      grep -q "SEXTANT PROTOCOL" dp_cockpit.html
      grep -q "DP RESILIENCE COCKPIT" dp_cockpit.html
      grep -q "runSimulation" dp_cockpit.html

      echo "DP cockpit structure: PASS"


  # -------------------------------------------------------
  # SAFETY BOUNDARY
  # -------------------------------------------------------

  - name: Validate simulation safety boundary
    run: |
      grep -q "SIMULATION_ONLY" dp_simulation_engine.js
      grep -q "NOT certified marine control software" dp_simulation_engine.js
      grep -q "NOT CERTIFIED MARINE CONTROL SOFTWARE" dp_cockpit.html

      echo "Safety boundary validation: PASS"


  # -------------------------------------------------------
  # FINAL VALIDATION SUMMARY
  # -------------------------------------------------------

  - name: DP validation summary
    run: |
      echo ""
      echo "============================================================"
      echo "        SEXTANT PROTOCOL – DP SYSTEM CI"
      echo "============================================================"
      echo ""
      echo "Repository Structure       : PASS"
      echo "Python Validation          : PASS / OPTIONAL"
      echo "JavaScript Syntax          : PASS"
      echo "Simulation Engine          : PASS"
      echo "Normal Scenario            : PASS"
      echo "Heavy Weather Scenario     : PASS"
      echo "Critical Scenario          : PASS"
      echo "Deterministic Replay       : PASS"
      echo "Cockpit Structure          : PASS"
      echo "Safety Boundary            : PASS"
      echo ""
      echo "============================================================"
      echo "        DP RESEARCH PROTOTYPE VALIDATION COMPLETE"
      echo "============================================================"
      echo ""
      echo "SIMULATION ONLY"
      echo "NOT CERTIFIED MARINE CONTROL SOFTWARE"
      echo "NO CONNECTION TO OPERATIONAL DP SYSTEMS"
      echo ""